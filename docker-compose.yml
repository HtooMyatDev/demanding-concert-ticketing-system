services:
  app:
    build: .
    expose:
      - "3001"
    volumes:
      - ./ticketing.db:/app/ticketing.db
      - ./ticketing.db-shm:/app/ticketing.db-shm
      - ./ticketing.db-wal:/app/ticketing.db-wal
    env_file:
      - .env
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always
