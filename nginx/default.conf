# HTTP - redirect all to HTTPS + serve certbot challenge
server {
    listen 80;
    server_name concert-ticketing-system.int.yt;

    # Certbot webroot challenge (needed for cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - reverse proxy to app
server {
    listen 443 ssl;
    server_name concert-ticketing-system.int.yt;

    ssl_certificate /etc/letsencrypt/live/concert-ticketing-system.int.yt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concert-ticketing-system.int.yt/privkey.pem;

    location / {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        proxy_pass http://app:3001/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
